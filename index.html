<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Help Queue</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--surface:#fff;--border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.18);
  --text:#1A1917;--muted:#6B6860;
  --accent:#2D5BE3;--accent-light:#EEF2FD;--accent-text:#1A3BB0;
  --danger:#C0392B;--danger-light:#FEF0EE;
  --success:#1A7A4A;--success-light:#EDFAF3;
  --warn:#B85C00;--warn-light:#FEF7EE;
  --r:10px;--rl:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04)
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px}
#app{width:100%;max-width:460px}
.section{display:none}.section.active{display:block}
.card{background:var(--surface);border-radius:var(--rl);border:.5px solid var(--border-strong);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
input[type=text]{width:100%;padding:10px 14px;border:.5px solid var(--border-strong);border-radius:var(--r);font-family:inherit;font-size:15px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s;margin-bottom:12px}
input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(45,91,227,.12)}
button{font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;border-radius:var(--r);padding:10px 18px;border:none;transition:opacity .15s,transform .1s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:hover:not(:disabled){opacity:.88}
.btn-danger{background:var(--danger-light);color:var(--danger);width:100%}
.btn-ghost{background:transparent;color:var(--muted);border:.5px solid var(--border-strong);width:100%}
.btn-ghost:hover{background:var(--bg)}
.divider{border:none;border-top:.5px solid var(--border);margin:16px 0}
.err{font-size:13px;color:var(--danger);margin-top:-6px;margin-bottom:10px}
.info-box{background:var(--accent-light);border:.5px solid rgba(45,91,227,.2);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--accent-text);margin-bottom:12px}
.status-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r);font-size:13px;font-weight:500;margin-bottom:16px}
.s-idle{background:var(--bg);color:var(--muted);border:.5px solid var(--border)}
.s-waiting{background:var(--warn-light);color:var(--warn);border:.5px solid rgba(184,92,0,.2)}
.s-next{background:var(--accent-light);color:var(--accent-text);border:.5px solid rgba(45,91,227,.2)}
.pos-info{text-align:center;padding:12px;font-size:14px;color:var(--muted);margin-bottom:12px}
.pos-info strong{color:var(--text);font-size:20px;display:block;margin-bottom:2px}
.meta-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:12px}
.link-btn{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.q-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:var(--r);border:.5px solid var(--border);margin-bottom:8px}
.q-item.first{background:var(--accent-light);border-color:rgba(45,91,227,.25)}
.q-item.first .q-name{color:var(--accent-text)}
.q-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);min-width:22px}
.q-name{flex:1;font-weight:500;font-size:15px}
.q-time{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}
.badge-next{background:var(--accent);color:#fff}
.badge-you{background:var(--warn-light);color:var(--warn)}
.empty{text-align:center;padding:28px 0 12px;color:var(--muted);font-size:14px}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:26px;font-weight:600;letter-spacing:-.5px;margin-bottom:4px}
.header p{font-size:14px;color:var(--muted)}
.teacher-link{text-align:center;margin-top:8px}
.teacher-link a{font-size:13px;color:var(--muted);text-decoration:none}
.teacher-link a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="header">
  <h1>📋 Class Help Queue</h1>
  <p>Raise your hand — digitally.</p>
</div>
<div id="app">

  <div id="s-code" class="section active">
    <div class="card">
      <div class="lbl">Student</div>
      <p style="font-size:14px;color:var(--muted);margin-bottom:14px">Enter the class code your teacher gave you.</p>
      <input type="text" id="i-code" placeholder="Class code (e.g. MATH3)" maxlength="20" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')checkCode()">
      <div class="err" id="e-code"></div>
      <button class="btn-primary" onclick="checkCode()">Next</button>
    </div>
    <div class="teacher-link"><a href="teacher.html">Teacher login</a></div>
  </div>

  <div id="s-name" class="section">
    <div class="card">
      <div class="lbl">Almost there</div>
      <div class="info-box" id="name-class-lbl"></div>
      <input type="text" id="i-name" placeholder="Your first name" maxlength="32" onkeydown="if(event.key==='Enter')enterQueue()">
      <div class="err" id="e-name"></div>
      <button class="btn-primary" onclick="enterQueue()">Enter Queue</button>
      <hr class="divider">
      <button class="btn-ghost" onclick="go('s-code')">Back</button>
    </div>
  </div>

  <div id="s-main" class="section">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="lbl" style="margin-bottom:0" id="main-class"></div>
        <span style="font-size:13px;font-weight:500;color:var(--muted)" id="main-name"></span>
      </div>
      <div id="status-bar" class="status-bar s-idle">Not in queue</div>
      <div id="pos-info" style="display:none" class="pos-info">
        <strong id="pos-n"></strong><span id="pos-t"></span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn-primary" id="btn-join" onclick="joinQueue()" style="flex:1">✋ Join Queue</button>
        <button class="btn-danger" id="btn-leave" onclick="leaveQueue()" style="flex:1;display:none">✓ Leave Queue</button>
      </div>
      <hr class="divider">
      <div class="meta-row">
        <span><strong id="q-count">0</strong> waiting</span>
        <button class="link-btn" onclick="logout()">Change name / class</button>
      </div>
      <div id="q-list"><div class="empty">Loading...</div></div>
    </div>
  </div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey: "AIzaSyAMidsyva-82OJVpPgaJMGIxDoWi75Y58I",
  authDomain: "classqueue-66037.firebaseapp.com",
  databaseURL: "https://classqueue-66037-default-rtdb.firebaseio.com",
  projectId: "classqueue-66037",
  storageBucket: "classqueue-66037.firebasestorage.app",
  messagingSenderId: "523072247188",
  appId: "1:523072247218:web:d61bf93c03b6fbe3dc2b81"
};

var fbApp = initializeApp(cfg);
var db    = getDatabase(fbApp);
var S     = { code: null, className: null, name: null, unsub: null, tick: null };

function go(id) {
  document.querySelectorAll(".section").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function agoShort(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+"s ago";
  var m=Math.floor(s/60);
  if(m<60) return m+"m ago";
  return Math.floor(m/60)+"h ago";
}

window.go = go;

window.checkCode = function() {
  var raw = document.getElementById("i-code").value.trim().toUpperCase();
  var err = document.getElementById("e-code");
  if (!raw) { err.textContent = "Enter your class code."; return; }
  var btn = document.querySelector("#s-code .btn-primary");
  btn.disabled = true; btn.textContent = "Checking...";
  get(ref(db, "classes/" + raw + "/config")).then(function(snap) {
    btn.disabled = false; btn.textContent = "Next";
    if (!snap.exists()) { err.textContent = 'No class found for "' + raw + '". Check with your teacher.'; return; }
    S.code = raw; S.className = snap.val().className;
    err.textContent = "";
    document.getElementById("name-class-lbl").textContent = "Class: " + S.className;
    go("s-name");
    setTimeout(function(){ document.getElementById("i-name").focus(); }, 80);
  }).catch(function(e){ btn.disabled=false; btn.textContent="Next"; err.textContent="Error: "+e.message; });
};

window.enterQueue = function() {
  var n = document.getElementById("i-name").value.trim();
  var err = document.getElementById("e-name");
  if (!n) { err.textContent = "Enter your first name."; return; }
  S.name = n;
  err.textContent = "";
  document.getElementById("main-class").textContent = S.className;
  document.getElementById("main-name").textContent = n;
  go("s-main");
  startListen();
};

window.logout = function() {
  if (S.unsub) { S.unsub(); S.unsub = null; }
  if (S.tick)  { clearInterval(S.tick); S.tick = null; }
  S.code = null; S.className = null; S.name = null;
  document.getElementById("i-name").value = "";
  document.getElementById("i-code").value = "";
  go("s-code");
};

window.joinQueue = function() {
  get(ref(db, "classes/" + S.code + "/queue")).then(function(snap) {
    var already = false;
    if (snap.exists()) {
      Object.values(snap.val()).forEach(function(v){ if(v.name.toLowerCase()===S.name.toLowerCase()) already=true; });
    }
    if (!already) push(ref(db, "classes/" + S.code + "/queue"), { name: S.name, ts: Date.now() });
  });
};

window.leaveQueue = function() {
  get(ref(db, "classes/" + S.code + "/queue")).then(function(snap) {
    if (!snap.exists()) return;
    Object.entries(snap.val()).forEach(function(e){
      if (e[1].name.toLowerCase()===S.name.toLowerCase()) remove(ref(db,"classes/"+S.code+"/queue/"+e[0]));
    });
  });
};

function startListen() {
  if (S.unsub) S.unsub();
  S.unsub = onValue(ref(db, "classes/" + S.code + "/queue"), function(snap) {
    var raw = snap.exists() ? snap.val() : {};
    var q = Object.entries(raw).map(function(e){ return Object.assign({},e[1],{_key:e[0]}); });
    q.sort(function(a,b){ return a.ts-b.ts; });
    renderStudent(q);
  });
  if (S.tick) clearInterval(S.tick);
  S.tick = setInterval(function(){
    document.querySelectorAll("[data-ts]").forEach(function(el){
      el.textContent = agoShort(parseInt(el.getAttribute("data-ts"),10));
    });
  }, 5000);
}

function renderStudent(q) {
  var idx = q.findIndex(function(x){ return x.name.toLowerCase()===S.name.toLowerCase(); });
  var inQ = idx !== -1;
  var sb  = document.getElementById("status-bar");
  var pi  = document.getElementById("pos-info");
  var jb  = document.getElementById("btn-join");
  var lb  = document.getElementById("btn-leave");
  if (inQ) {
    sb.className = idx===0 ? "status-bar s-next" : "status-bar s-waiting";
    sb.textContent = idx===0 ? "🎉 You're next! Get ready." : "⏳ You're in the queue";
    pi.style.display = "block";
    document.getElementById("pos-n").textContent = idx===0 ? "🎉" : "#"+(idx+1);
    document.getElementById("pos-t").textContent = idx===0 ? " You're next!" : " of "+q.length+" in line";
    jb.style.display="none"; lb.style.display="block";
  } else {
    sb.className = "status-bar s-idle";
    sb.textContent = "Not in queue — click to join when you need help";
    pi.style.display = "none";
    jb.style.display="block"; lb.style.display="none";
  }
  document.getElementById("q-count").textContent = q.length;
  var el = document.getElementById("q-list");
  if (!q.length) { el.innerHTML='<div class="empty">✅ Queue is empty — no wait!</div>'; return; }
  el.innerHTML = q.map(function(item,i){
    var isYou = item.name.toLowerCase()===S.name.toLowerCase();
    return '<div class="q-item '+(i===0?"first":"")+'">' +
      '<span class="q-num">'+(i+1)+'</span>' +
      '<span class="q-name">'+esc(item.name)+'</span>' +
      (i===0?'<span class="badge badge-next">Next</span>':'') +
      (isYou&&i>0?'<span class="badge badge-you">You</span>':'') +
      '<span class="q-time" data-ts="'+item.ts+'">'+agoShort(item.ts)+'</span>' +
    '</div>';
  }).join("");
}
</script>
</body>
</html>
