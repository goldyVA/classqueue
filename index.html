<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Queue</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--surface:#fff;--border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.18);
  --text:#1A1917;--muted:#6B6860;
  --accent:#2D5BE3;--accent-light:#EEF2FD;--accent-text:#1A3BB0;
  --success:#1A7A4A;--success-light:#EDFAF3;
  --r:12px;--rl:20px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 4px 24px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06)
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.wrap{width:100%;max-width:480px}
.hero{text-align:center;margin-bottom:48px}
.hero-icon{font-size:64px;margin-bottom:20px;display:block}
.hero h1{font-size:38px;font-weight:700;letter-spacing:-.8px;color:var(--text);margin-bottom:10px;line-height:1.1}
.hero p{font-size:16px;color:var(--muted);line-height:1.6;max-width:340px;margin:0 auto}
.choices{display:flex;flex-direction:column;gap:14px}
.choice-btn{display:flex;align-items:center;gap:20px;background:var(--surface);border-radius:var(--rl);border:.5px solid var(--border-strong);padding:24px 28px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .2s,transform .15s,border-color .2s;text-decoration:none;color:var(--text);width:100%;text-align:left;font-family:inherit}
.choice-btn:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:rgba(0,0,0,.28)}
.choice-btn:active{transform:translateY(0);box-shadow:var(--shadow)}
.choice-icon-wrap{border-radius:14px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.choice-btn.student .choice-icon-wrap{background:var(--accent-light)}
.choice-btn.teacher .choice-icon-wrap{background:var(--success-light)}
.choice-title{font-size:18px;font-weight:600;letter-spacing:-.2px;margin-bottom:4px}
.choice-sub{font-size:13px;color:var(--muted)}
.choice-arrow{margin-left:auto;font-size:22px;color:var(--muted);flex-shrink:0}
.footer{text-align:center;margin-top:28px;font-size:12px}
.footer a{color:var(--muted);text-decoration:none}
.footer a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="hero-icon">✋</span>
    <h1>Help Queue</h1>
    <p>A simple way to manage who needs help next — no more crowds at the teacher's desk.</p>
  </div>
  <div class="choices">
    <a href="student.html" class="choice-btn student">
      <div class="choice-icon-wrap">🙋</div>
      <div>
        <div class="choice-title">I'm a Student</div>
        <div class="choice-sub">Join the queue when you need help</div>
      </div>
      <span class="choice-arrow">›</span>
    </a>
    <a href="teacher.html" class="choice-btn teacher">
      <div class="choice-icon-wrap">👩‍🏫</div>
      <div>
        <div class="choice-title">I'm a Teacher</div>
        <div class="choice-sub">Sign in to manage your class queue</div>
      </div>
      <span class="choice-arrow">›</span>
    </a>
  </div>
  <div class="footer"><a href="admin.html">Admin console</a></div>
</div>
</body>
</html>
